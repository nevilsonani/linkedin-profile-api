[project]
name = "linkedin-profile-api"
version = "1.0.0"
description = "Structured JSON extraction of LinkedIn member profiles via the private Voyager API."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
    "SIM108", # explicit if/else often reads better than a nested ternary
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # conftest sets env vars before importing app modules
